name: ci

on:
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: System binaries
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr ghostscript qpdf unpaper pngquant libmagic1 pandoc ffmpeg libreoffice-writer libreoffice-calc
      - uses: astral-sh/setup-uv@v7
      - run: cd backend && uv sync --locked
      - run: cd backend && uv run ruff check .
      - run: cd backend && uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: cd frontend && bun install --frozen-lockfile && bun run test && bun run build
